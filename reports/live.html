<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Live coach: decisions on the call</title>
<style>
:root{--s:#ffffff;--ink:#0e1526;--ink2:#4a5570;--btn:#eef1f7;--btnh:#e3e8f2;
--line:#d5dbe8;--ac:#0d9488;--ac2:#4f46e5;--on:#ffffff;--red:#b3261e;--bg:#f2f4f9}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);
font:14px/1.5 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;
-webkit-font-smoothing:antialiased;overflow:hidden}
select,button,input{font:13px/1.2 Inter,system-ui,sans-serif;padding:7px 11px;
border:1px solid var(--line);border-radius:9px;background:var(--s);color:var(--ink)}
button{cursor:pointer}button:hover{border-color:var(--ac)}
button.on{background:var(--ac);color:var(--on);border-color:var(--ac)}
button:disabled{opacity:.4;cursor:default}
.side{position:fixed;left:16px;top:16px;bottom:96px;width:330px;
max-width:calc(100vw - 32px);background:var(--s);border:1px solid var(--line);
border-radius:16px;display:flex;flex-direction:column;overflow:hidden;
box-shadow:0 14px 40px -18px rgba(8,12,24,.22);z-index:10}
.side-h{padding:12px 14px 8px;border-bottom:1px solid var(--line);
display:flex;align-items:baseline;gap:8px}
.side-h b{font-size:12.5px;letter-spacing:.02em}
.side-h span{font-size:11px;color:var(--ink2)}
.side-body{flex:1;overflow-y:auto;padding:10px 12px;display:flex;
flex-direction:column;gap:7px}
.tl{font-size:12.5px;line-height:1.45;padding:6px 10px;border-radius:9px;
background:var(--btn)}
.tl.me{background:#e2f5ef}
.tl .w{font-size:9px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;
color:var(--ink2);display:block;margin-bottom:1px}
.tl.sys{background:none;color:var(--ink2);font-size:11px;text-align:center;padding:2px}
.side-f{border-top:1px solid var(--line);padding:8px 10px;display:flex;gap:6px}
.side-f select{max-width:78px}
.side-f input{flex:1;min-width:0}
.foot{position:fixed;left:50%;transform:translateX(-50%);bottom:20px;z-index:40;
display:flex;gap:8px;align-items:center;background:var(--s);
border:1px solid var(--line);border-radius:16px;padding:10px 14px;
box-shadow:0 18px 50px -20px rgba(8,12,24,.28);flex-wrap:wrap;
max-width:calc(100vw - 32px)}
.foot .gap{width:1px;height:22px;background:var(--line)}
.rec{position:fixed;top:14px;right:16px;z-index:60;display:flex;gap:8px}
.recb{display:flex;align-items:center;gap:6px;background:var(--s);
border:1px solid var(--line);border-radius:999px;padding:5px 12px;
font-size:11.5px;font-weight:600;color:var(--red)}
.recb .b{width:8px;height:8px;border-radius:50%;background:var(--red);
animation:pulse 1.2s infinite}
@keyframes pulse{50%{opacity:.35}}
.win{position:fixed;left:56%;top:44%;transform:translate(-50%,-50%);
width:400px;max-width:calc(100vw - 32px);height:min(640px,calc(100dvh - 150px));
background:var(--s);border:1px solid var(--line);border-radius:18px;
box-shadow:0 28px 70px -26px rgba(8,12,24,.34),
0 0 0 1px color-mix(in srgb,var(--ac) 22%,transparent);
display:flex;flex-direction:column;overflow:hidden;z-index:20}
.dragbar{flex:0 0 28px;height:28px;padding-left:10px;display:flex;
align-items:center;gap:8px;cursor:grab;touch-action:none}
.dragbar:active{cursor:grabbing}
.dragbar span{font-size:9.5px;letter-spacing:.12em;color:var(--ink2);font-weight:600}
.toprow{display:flex;align-items:center;gap:9px;padding:4px 12px 10px;
border-bottom:1px solid var(--line)}
.macdot{width:16px;height:16px;border-radius:50%;background:#e6e9f2;
border:1px solid var(--line);color:var(--ink2);font-size:9px;line-height:14px;
text-align:center;cursor:pointer;padding:0}
.pill{display:flex;align-items:center;gap:7px;background:var(--btn);
border-radius:999px;padding:4px 11px;min-width:0}
.pill .d{width:8px;height:8px;border-radius:50%;background:var(--ac);flex:0 0 8px}
.pill b{font-size:12.5px;font-weight:600;white-space:nowrap}
.pill .tech{font-size:9.5px;letter-spacing:.07em;color:var(--ink2);
text-transform:uppercase;white-space:nowrap}
.orbs{display:flex;gap:6px;margin-left:auto;align-items:center}
.orb{width:28px;height:28px;border-radius:50%;background:var(--btn);
border:1px solid var(--line);transition:background .15s,box-shadow .15s}
.orb.live{background:var(--ac);border-color:var(--ac);
box-shadow:0 0 0 4px color-mix(in srgb,var(--ac) 20%,transparent)}
.orb.o.live{background:var(--ac2);border-color:var(--ac2);
box-shadow:0 0 0 4px color-mix(in srgb,var(--ac2) 20%,transparent)}
.elapsed{font:12px/1 ui-monospace,Menlo,monospace;color:var(--ink2)}
.wbody{flex:1;overflow-y:auto;padding:12px 14px;display:flex;
flex-direction:column;gap:8px}
.now{border:1px solid var(--line);border-radius:12px;padding:10px 12px;
background:var(--btn);flex:0 0 auto}
.now .tag{font-size:10px;font-weight:700;letter-spacing:.08em;
text-transform:uppercase;color:var(--ink2);display:block}
.now.fire{border-color:var(--ac);background:#eefaf7}
.now.fire .tag{color:var(--ac)}
.now .sig{font-weight:700;font-size:14.5px;margin-top:2px}
.now .fld{font-size:12.5px;color:var(--ink2);margin-top:2px}
.now .fld b{color:var(--ink)}
.feed{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:6px;
min-height:60px}
.feed-h{font-size:9.5px;letter-spacing:.1em;color:var(--ink2);font-weight:700;
text-transform:uppercase;margin-top:2px}
.fcard{border:1px solid var(--line);border-radius:11px;padding:8px 11px;
background:var(--s)}
.fcard .t{font:10px ui-monospace,Menlo,monospace;color:var(--ink2)}
.fcard.quiet .q{font-size:12px;color:var(--ink2);margin-top:1px}
.fcard.fire{border-color:var(--ac);background:#f4fbf9}
.fcard.fire .sig{font-weight:700;font-size:13px;margin-top:1px}
.fcard.fire .fld{font-size:11.5px;color:var(--ink2);margin-top:1px}
.fcard.fire .fld b{color:var(--ink)}
.fcard.empty{border-style:dashed;color:var(--ink2);font-size:11.5px;text-align:center}
@media(max-width:900px){.side{display:none}}
</style></head>
<body>
<div class="rec" id="rec"></div>

<aside class="side">
<div class="side-h"><b>Transcript</b><span id="sideStatus">idle</span></div>
<div class="side-body" id="chat"></div>
<form class="side-f" id="f">
<select id="whoSel"><option value="seller">Me</option>
<option value="buyer">Buyer</option></select>
<input id="msg" placeholder="type a line, press Enter" autocomplete="off">
<button>Send</button>
</form>
</aside>

<div class="foot">
<select id="persona" title="who to practice with"></select>
<select id="arch" title="which architecture decides"></select>
<button class="on" id="btnGo">Practice</button>
<span class="gap"></span>
<button id="btnMic" title="capture your voice (seller)">My microphone</button>
<button id="btnTab" title="capture the other side via this machine's audio">Machine audio</button>
<button id="btnReset" style="display:none">New call</button>
</div>

<div class="win" id="win">
<div class="dragbar" id="drag" title="Drag it anywhere"><span>&#9638; COACH &#8212; DRAG</span></div>
<div class="toprow">
<button class="macdot" id="btnEnd" title="End call">&#10005;</button>
<div class="pill"><span class="d"></span><b id="whoName">Buyer</b>
<span class="tech" id="whoTech">SPIN</span></div>
<div class="orbs"><div class="orb" id="orbMe" title="you"></div>
<div class="orb o" id="orbOther" title="buyer"></div></div>
<span class="elapsed" id="elap">00:00</span>
</div>
<div class="wbody">
<div class="now" id="now"><span class="tag">coach stays quiet</span>
<div class="fld" id="nowTxt">listening&#8230;</div></div>
<div class="feed-h">this call, in order</div>
<div class="feed" id="feed">
<div class="fcard empty" id="feedEmpty">every decision the coach makes
appears here</div>
</div>
</div>
</div>
<script>
const API="https://coach.178.104.226.202.sslip.io";
const PERSONAS={
 elena:{name:"Elena",tech:"SPIN",
  sys:"You are Elena, VP Sales at a logistics software company (40 reps). You are on a first discovery call with a seller of PipeLens, a call-recording and rep-ramp tool. You are polite but guarded: you lost reps last quarter, ramp is slow, but you froze new tool spend until next quarter and anything over forty thousand a year needs CFO sign-off. You had two tools die before because reps didn't trust them. Stay realistic, skeptical, concrete. Speak 1-3 short sentences per turn, then wait for the seller. Never break character, never mention being an AI."},
 tom:{name:"Tom",tech:"CHALLENGER",
  sys:"You are Tom, CRO of an industrial supplies company (22 reps). A proposal is on the table and your board just moved the growth plan up six weeks, whatever you buy must be live by April 15. You want a reference call with a CRO who runs teams like yours, you will push for fifteen percent off, and you know Dana Reyes, a CRO at a bigger firm, who asked what you are doing about ramp. Blunt, busy, concrete. Speak 1-3 short sentences, then wait. Never break character."},
 priya:{name:"Priya",tech:"NEPQ",
  sys:"You are Priya, Sales Ops Director at an insurance group (18 reps). The last tool (CallTape) flopped: eight months, zero adoption. You want to poke at the product yourself, quietly, before believing anything. Your managers only get 30 minutes a week for coaching, finance approved forty-five dollars a seat not sixty, and Daniel in RevOps must pass security review. Dry, precise, slightly suspicious. Speak 1-3 short sentences, then wait. Never break character."}};
let ARCHS={},archSys="",mode=null,lines=[],fires=[],busy=false,t0=null,elapT=null;
const $=id=>document.getElementById(id),chat=$("chat"),now=$("now"),feed=$("feed");
function esc(t){return(t||"").replace(/</g,"&lt;");}
function tl(who,text){const d=document.createElement("div");
d.className="tl "+(who==="Seller"?"me":"sys");d.innerHTML=
'<span class="w">'+who+"</span>"+esc(text);
if(who!=="Seller")d.className="tl";
chat.appendChild(d);chat.scrollTop=1e9;}
function sys(t){const d=document.createElement("div");d.className="tl sys";
d.textContent=t;chat.appendChild(d);chat.scrollTop=1e9;}
function mmss(){const s=(Date.now()-t0)/1e3|0;
return String(s/60|0).padStart(2,"0")+":"+String(s%60).padStart(2,"0");}
async function api(path,body){const r=await fetch(API+path,{method:"POST",
headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
if(!r.ok)throw new Error((await r.text()).slice(0,120));return r.json();}

async function loadArchs(){
const ids=["variant-1","variant-9","variant-13"];
const names={"variant-1":"v1 (early rules)","variant-9":"v9",
"variant-13":"v13 (best)"};
for(const v of ids){const r=await fetch("variants/"+v+".md");
ARCHS[v]=await r.text();}
$("arch").innerHTML=ids.map(v=>'<option value="'+v+'">'+names[v]+"</option>")
.join("").replace('value="variant-13"','value="variant-13" selected');}

function parse(t){const out={};if(!t)return out;const ls=t.trim().split("\n");
const head=ls[0].trim();
if(head.toUpperCase().startsWith("FIRE"))out.decision="FIRE";
else if(head.toUpperCase().startsWith("HOLD")){out.decision="HOLD";
const m=head.match(/^HOLD\s*[:\uff1a]\s*(.*)$/i);if(m)out.hold_reason=m[1].trim();}
const F=/^(SIGNAL|WHY IT MATTERS|NEXT BEST MOVE|LEVEL|CAPTURE)\s*[:\uff1a]\s*(.*)$/i;
for(const l of ls.slice(1)){const m=l.trim().match(F);if(!m)continue;
const k=m[1].toUpperCase(),v=m[2].trim();
if(k==="SIGNAL")out.signal=v;else if(k==="WHY IT MATTERS")out.why=v;
else if(k==="NEXT BEST MOVE")out.move=v;
else if(k==="LEVEL")out.level=parseInt(v[0]);
else if(k==="CAPTURE")out.capture=v;}
return out;}

const LOCK=/\b(lock\w*|clos\w*|date[sd]?|meeting|calendar|attendees|next step)\b/i;
const norm=s=>s.toLowerCase().replace(/[^a-z0-9 ]/g," ").trim();
function walls(d){if(d.decision!=="FIRE"||!fires.length)return d;
const recent=fires.slice(-3);
for(const f of recent){if(norm(d.signal)&&norm(d.signal)===norm(f.signal)){
d.decision="HOLD";d.hold_reason="one card per signal";return d;}}
if(LOCK.test(d.move||"")||LOCK.test(d.signal||"")){
for(const f of recent){if(LOCK.test((f.move||"")+" "+(f.signal||""))){
d.decision="HOLD";d.hold_reason="already coached the close";return d;}}}
return d;}

function pushDecision(d){
const fe=$("feedEmpty");if(fe)fe.remove();
const c=document.createElement("div");
if(d.decision==="FIRE"){c.className="fcard fire";
c.innerHTML='<span class="t">'+mmss()+' &#183; FIRE L'+(d.level||3)+
'</span><div class="sig">'+esc(d.signal||"")+'</div><div class="fld"><b>Why:</b> '+
esc(d.why||"")+'</div><div class="fld"><b>Next:</b> '+esc(d.move||"")+"</div>";
now.className="now fire";
now.innerHTML='<span class="tag">coach speaks</span><div class="sig">'+
esc(d.signal||"")+'</div><div class="fld"><b>Why:</b> '+esc(d.why||"")+
'</div><div class="fld"><b>Next move:</b> '+esc(d.move||"")+"</div>";}
else{c.className="fcard quiet";
c.innerHTML='<span class="t">'+mmss()+' &#183; quiet</span><div class="q">'+
esc(d.hold_reason||"stays quiet")+"</div>";
now.className="now";
now.innerHTML='<span class="tag">coach stays quiet</span><div class="fld">'+
esc(d.hold_reason||"let the buyer continue")+"</div>";}
feed.appendChild(c);feed.scrollTop=1e9;}

async function coachTurn(){
if(!archSys){await loadArchs();archSys=ARCHS[$("arch").value]||"";}
if(!archSys){pushDecision({decision:"HOLD",
hold_reason:"(no architecture loaded, pick one below)"});return;}
const cur=lines[lines.length-1];
if(!cur||!cur.startsWith("Buyer:"))return;
const user="CALL TRANSCRIPT SO FAR:\n"+lines.slice(-40).map(l=>
l.startsWith("Buyer:")?"**Buyer:**"+l.slice(6):"**Seller:**"+l.slice(8))
.join("\n")+"\n\nCURRENT MOMENT (buyer just finished, 1.5s pause):\n**Buyer:**"+
cur.slice(6)+"\n\nDecide now: HOLD or FIRE.";
try{const r=await api("/v1/chat",{system:archSys,user,max_tokens:300});
let d=parse(r.text||"");
if(!d.decision){pushDecision({decision:"HOLD",hold_reason:"(no parseable decision)"});return;}
d=walls(d);
if(d.decision==="FIRE")fires.push(d);
pushDecision(d);}catch(e){
now.className="now";
now.innerHTML='<span class="tag">coach stays quiet</span><div class="fld">relay: '+
esc(e.message)+"</div>";}}

async function buyerReply(){
const p=PERSONAS[$("persona").value];orbOther.classList.add("live");
try{const convo=lines.map(l=>l.startsWith("Buyer:")?"Buyer: "+l.slice(6)
:"Seller: "+l.slice(8)).join("\n");
const r=await api("/v1/chat",{system:p.sys,
user:"Call so far:\n"+convo+
"\n\nReply with your next line as the Buyer only. No narration.",
max_tokens:200});
const t=(r.text||"").trim();
if(t){lines.push("Buyer: "+t);tl("Buyer",t);await coachTurn();}
}catch(e){sys("relay: "+e.message);}
orbOther.classList.remove("live");}

$("f").onsubmit=async e=>{e.preventDefault();if(busy)return;busy=true;
const m=$("msg"),t=m.value.trim();if(!t){busy=false;return;}m.value="";
const who=$("whoSel").value==="buyer"?"Buyer":"Seller";
lines.push(who+": "+t);tl(who,t);
if(mode==="persona"&&who==="Seller")await buyerReply();
else if(who==="Buyer")await coachTurn();
busy=false;};

function setup(m){mode=m;lines=[];fires=[];chat.innerHTML="";
feed.innerHTML='<div class="fcard empty" id="feedEmpty">every decision the coach makes appears here</div>';
archSys=ARCHS[$("arch").value]||"";
if(m==="real"){$("whoName").textContent="Live call";$("whoTech").textContent="REAL";}
else{const p=PERSONAS[$("persona").value];
$("whoName").textContent=p.name;$("whoTech").textContent=p.tech;}
$("btnReset").style.display="";
if(elapT)clearInterval(elapT);
t0=Date.now();$("elap").textContent="00:00";
elapT=setInterval(()=>$("elap").textContent=mmss(),1000);
now.className="now";
now.innerHTML='<span class="tag">coach stays quiet</span><div class="fld">listening&#8230;</div>';}
$("btnGo").onclick=()=>{stopAll();setup("persona");
sys(PERSONAS[$("persona").value].name+" joined. Open with your pitch or a question.");};
$("btnReset").onclick=()=>{stopAll();setup(mode);
if(mode==="persona")sys("new call. you open.");};
$("btnEnd").onclick=()=>{stopAll();sys("call ended "+mmss());};

const win=$("win");let drag=null;
$("drag").onpointerdown=e=>{drag={x:e.clientX-win.offsetLeft,y:e.clientY-win.offsetTop};
win.style.transform="none";$("drag").setPointerCapture(e.pointerId);};
$("drag").onpointermove=e=>{if(!drag)return;
win.style.left=Math.max(0,e.clientX-drag.x)+"px";
win.style.top=Math.max(0,e.clientY-drag.y)+"px";};
$("drag").onpointerup=()=>{drag=null;};
$("msg").oninput=()=>{orbMe.classList.toggle("live",$("msg").value.trim().length>0);};
$("persona").innerHTML=Object.entries(PERSONAS)
.map(([k,p])=>'<option value="'+k+'">'+p.name+" &#8212; "+p.tech+"</option>").join("");

const mic={on:false,stream:null,rec:null,timer:null,keep:[],who:"Seller",audio:null};
const tab={on:false,stream:null,rec:null,timer:null,keep:[],who:"Buyer",audio:null};
let audioCtx=null,lastHeardAt=0,lastHeard={};

function startSrc(src,stream){
src.stream=stream;src.on=true;src.keep=[];
src.audio=new MediaStream(stream.getAudioTracks());
spin(src);meter(src);badge();
if(!mode)setup("real");}
function spin(src){
if(!src.on)return;
src.n=(src.n||0)+1;
let rec;
try{const mime=["audio/webm;codecs=opus","audio/webm",""]
.find(m=>!m||MediaRecorder.isTypeSupported(m));
rec=mime?new MediaRecorder(src.audio,{mimeType:mime})
:new MediaRecorder(src.audio);}
catch(e){rec=new MediaRecorder(src.audio);}
const parts=[];
rec.ondataavailable=e=>{if(e.data&&e.data.size)parts.push(e.data);};
rec.onstop=()=>{
if(!src.on){download(src);return;}
if(parts.length){src.keep.push(...parts);
sendSeg(src,new Blob(parts,{type:rec.mimeType||"audio/webm"}));}
setTimeout(()=>spin(src),50);};
rec.start();src.rec=rec;
src.timer=setTimeout(()=>{try{if(rec.state==="recording")rec.stop();}
catch(e){}},6000);}
function download(src){if(!src.keep.length)return;
const url=URL.createObjectURL(new Blob(src.keep,{type:"audio/webm"}));
const a=document.createElement("a");a.href=url;
a.download=(src.who==="Buyer"?"call":"mic")+"-recording.webm";a.click();}
async function sendSeg(src,blob){
status();
if(blob.size<3500)return;
try{const b64=btoa(String.fromCharCode(...new Uint8Array(
await blob.arrayBuffer())));
const r=await api("/v1/stt",{audio_b64:b64,mime:"audio/webm"});
const t=(r.text||"").trim();
if(t.length>3)await heard(src.who,t);else status();}
catch(e){status("stt retrying");}}
function status(x){const s=[];
if(mic.on)s.push("mic");if(tab.on)s.push("machine");
let out=s.length?s.join(" + ")+" live":"idle";
if(lastHeardAt)out+=" | heard "+((Date.now()-lastHeardAt)/1e3|0)+"s ago";
if(x)out+=" | "+x;
$("sideStatus").textContent=out;}
setInterval(()=>{if(mic.on||tab.on)status();},4000);

function stopSrc(src){src.on=false;
if(src.timer)clearTimeout(src.timer);
if(src.rec&&src.rec.state!=="inactive"){try{src.rec.stop();}catch(e){download(src);}}
else download(src);
if(src.stream){src.stream.getTracks().forEach(t=>t.stop());src.stream=null;}
badge();}
function stopAll(){stopSrc(mic);stopSrc(tab);
$("btnMic").classList.remove("on");$("btnTab").classList.remove("on");
status();}
function badge(){const p=[];
if(mic.on)p.push('<span class="recb"><span class="b"></span>mic (you)</span>');
if(tab.on)p.push('<span class="recb"><span class="b"></span>call audio (buyer)</span>');
$("rec").innerHTML=p.join("");}

$("btnMic").onclick=async()=>{
if(mic.on){stopSrc(mic);$("btnMic").classList.remove("on");status();return;}
try{const s=await navigator.mediaDevices.getUserMedia({audio:true});
startSrc(mic,s);$("btnMic").classList.add("on");
sys("mic live: your speech becomes Seller lines");status();}
catch(e){sys("mic: "+e.message);}};
$("btnTab").onclick=async()=>{
if(tab.on){stopSrc(tab);$("btnTab").classList.remove("on");status();return;}
try{const s=await navigator.mediaDevices.getDisplayMedia({video:true,audio:true});
if(!s.getAudioTracks().length){s.getTracks().forEach(t=>t.stop());
sys("no audio in that share: pick the tab with the call and tick Share audio");return;}
s.getVideoTracks().forEach(t=>t.stop());
startSrc(tab,s);$("btnTab").classList.add("on");
sys("machine audio live: the other side becomes Buyer lines");status();}
catch(e){sys("share: "+e.message);}};

function meter(src){if(!audioCtx)audioCtx=new AudioContext();
const ctx=audioCtx,an=ctx.createAnalyser();an.fftSize=512;
try{const node=ctx.createMediaStreamSource(src.audio);node.connect(an);
const buf=new Uint8Array(an.fftSize);
(function tick(){if(!src.on)return;requestAnimationFrame(tick);
an.getByteTimeDomainData(buf);let sum=0;
for(let i=0;i<buf.length;i++){const v=(buf[i]-128)/128;sum+=v*v;}
const rms=Math.sqrt(sum/buf.length);
(src.who==="Buyer"?orbOther:orbMe).classList.toggle("live",rms>0.02);})();}
catch(e){}}

const NOISE=/^\s*[\[(][^\])]*[\])]\s*[.!]?\s*$/;
function speechOk(t){
if(NOISE.test(t))return false;
if(!/[a-z]{2,}/i.test(t)&&!/[0-9]/.test(t))return false;
return true;}

async function heard(who,t){
const k=norm(t).slice(0,60);
if(lastHeard[k]&&Date.now()-lastHeard[k]<15000)return;
if(!speechOk(t)){lastHeard[k]=Date.now();status("noise skipped");return;}
lastHeard[k]=Date.now();lastHeardAt=Date.now();status();
lines.push(who+": "+t);tl(who,t);
if(who==="Buyer")await coachTurn();
else if(mode==="persona")await buyerReply();}
loadArchs();
</script>
